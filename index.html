<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Prodea Satış Ops</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .mark { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, #0ea5e9, #1e40af); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .t1 { font-weight: 600; } .t2 { font-size: 12px; color: #64748b; }
  h1 { font-size: 17px; margin: 0 0 4px; } p.sub { margin: 0 0 16px; color: #64748b; font-size: 13px; }
  input[type=password] { width: 100%; height: 42px; border: 1px solid #cbd5e1; border-radius: 9px; padding: 0 12px; font-size: 16px; background: #fff; color: inherit; }
  input[type=password]:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,.15); }
  label.rem { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 13px; color: #475569; }
  button { width: 100%; height: 42px; border: 0; border-radius: 9px; background: #1d4ed8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #be123c; font-size: 13px; min-height: 18px; margin-top: 10px; }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } .card { background: #111a2e; border-color: #1e293b; }
    input[type=password] { background: #0b1220; border-color: #334155; } .t2, p.sub, label.rem { color: #94a3b8; } }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="logo"><div class="mark">P</div><div><div class="t1">Prodea Satış Ops</div><div class="t2">SAP satış organizasyonu</div></div></div>
  <h1>Parola</h1>
  <p class="sub">Bu sayfa şirket içi kullanım içindir. Parolayı satış ekibinden alabilirsiniz.</p>
  <input type="text" name="username" value="prodea-satis" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Parola" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked> Bu cihazda hatırla</label>
  <button id="go" type="submit">Aç</button>
  <div class="err" id="err"></div>
</form>
